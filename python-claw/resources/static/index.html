<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaClaw - 网页对话</title>
    <!-- 引入 marked.js 用于 Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 highlight.js 用于代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/core.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 800px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }
        .header h1 { font-size: 18px; color: #333; }
        .status { font-size: 12px; color: #999; margin-top: 5px; }
        .status.connected { color: #4caf50; }
        .status.disconnected { color: #f44336; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user .bubble {
            background: #007bff;
            color: white;
        }
        .bot .bubble {
            background: #f0f0f0;
            color: #333;
        }
        /* Markdown 样式 */
        .bot .bubble {
            overflow-wrap: break-word;
        }
        .bot .bubble p {
            margin: 0.5em 0;
        }
        .bot .bubble p:first-child {
            margin-top: 0;
        }
        .bot .bubble p:last-child {
            margin-bottom: 0;
        }
        .bot .bubble pre {
            background: #f6f8fa;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .bot .bubble code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 13px;
        }
        .bot .bubble :not(pre) > code {
            background: rgba(0,0,0,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .bot .bubble ul, .bot .bubble ol {
            margin: 8px 0;
            padding-left: 24px;
        }
        .bot .bubble li {
            margin: 4px 0;
        }
        .bot .bubble blockquote {
            border-left: 3px solid #ddd;
            padding-left: 12px;
            margin: 8px 0;
            color: #666;
        }
        .bot .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
        }
        .bot .bubble th, .bot .bubble td {
            border: 1px solid #ddd;
            padding: 8px 12px;
        }
        .bot .bubble th {
            background: #f6f8fa;
            font-weight: 600;
        }
        .bot .bubble a {
            color: #007bff;
            text-decoration: none;
        }
        .bot .bubble a:hover {
            text-decoration: underline;
        }
        .bot .bubble h1, .bot .bubble h2, .bot .bubble h3 {
            margin: 12px 0 8px 0;
            font-weight: 600;
        }
        .bot .bubble h1 { font-size: 1.4em; }
        .bot .bubble h2 { font-size: 1.2em; }
        .bot .bubble h3 { font-size: 1.1em; }
        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        #messageInput:focus { outline: none; border-color: #007bff; }
        #sendBtn {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        #sendBtn:hover { background: #0056b3; }
        #sendBtn:disabled { background: #ccc; cursor: not-allowed; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 JavaClaw - 网页对话</h1>
            <div class="status" id="status">连接中...</div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="if(event.keyCode===13) sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        let ws;
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        let loadingDiv = null;

        // 配置 marked.js
        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        function connect() {
            ws = new WebSocket('ws://localhost:8080/ws/chat');

            ws.onopen = () => {
                statusEl.textContent = '已连接';
                statusEl.className = 'status connected';
                sendBtn.disabled = false;
            };

            ws.onclose = () => {
                statusEl.textContent = '已断开，正在重连...';
                statusEl.className = 'status disconnected';
                sendBtn.disabled = true;
                setTimeout(connect, 3000);
            };

            ws.onerror = (e) => {
                console.error('WebSocket 错误:', e);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'reply') {
                    removeLoading();
                    addMessage(data.message, 'bot');
                } else if (data.type === 'error') {
                    removeLoading();
                    addMessage('错误：' + data.message, 'bot');
                }
            };
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = 'message ' + type;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (type === 'bot') {
                // 使用 marked.js 渲染 Markdown
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.textContent = text;
            }

            div.appendChild(bubble);
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showLoading() {
            loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.innerHTML = '<div class="bubble"><div class="loading"></div></div>';
            messagesEl.appendChild(loadingDiv);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeLoading() {
            if (loadingDiv) {
                loadingDiv.remove();
                loadingDiv = null;
            }
        }

        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            addMessage(text, 'user');
            showLoading();
            ws.send(JSON.stringify({ message: text }));
            inputEl.value = '';
        }

        // 初始化连接
        connect();
    </script>
</body>
</html>
