research_task:
  description: >
    基于用户提供的信息，围绕 {brand_name}、{product_name} 和 {project_description}，
    调研 {target_market} 的行业现状、市场趋势、目标客户需求、用户痛点、
    主要竞争对手、竞品定位、竞品营销渠道、市场机会和潜在风险。
    必须区分已验证事实、合理推断和暂无足够证据的信息，
    不得为了完整而编造数据。

project_understanding_task:
  description: >
    结合市场研究结果，分析 {product_name} 解决的问题、目标客户、购买动机、
    核心价值、主要卖点、竞争差异、购买阻力和品牌语气。
    请明确产品与市场机会之间的关系，并指出当前最适合优先发力的方向。

marketing_strategy_task:
  description: >
    基于研究和项目理解，为 {brand_name} 的 {product_name} 制定可执行的营销策略。
    输出应包含营销定位、价值主张、营销目标、目标客户、用户转化路径、
    营销策略、营销渠道、渠道分工、KPI 和预算建议。
    预算需符合 {budget}，渠道需结合 {platforms}，品牌语气需符合 {brand_tone}，
    并以 {current_year} 年的市场环境为背景。

campaign_idea_task:
  description: >
    根据营销策略，生成恰好 5 个差异明显的营销活动。
    每个活动都必须包含 name、description、target_audience、channel、core_message。
    五个活动不能只是标题不同，而要覆盖不同的切入点、平台或转化目标。

copy_creation_task:
  description: >
    针对已生成的 5 个营销活动，为 {platforms} 中的相关平台创作营销文案。
    每条文案必须包含 campaign_name、platform、title、body、call_to_action。
    不同平台内容必须明显不同，且不得出现“保证就业”“保证涨薪”“百分之百有效”等夸大承诺。

quality_review_task:
  description: >
    对完整方案进行最终审核，检查研究信息是否可能编造，策略是否符合营销目标，
    预算是否合理，渠道是否匹配目标客户，活动是否重复，活动是否可执行，
    文案是否夸大，文案是否符合品牌语气，以及文案是否缺少行动号召。
    如果发现问题，请直接修正后输出最终 Markdown 方案。
    最终输出必须包含以下章节：一、项目概述；二、市场研究；三、目标客户；四、竞争分析；
    五、产品定位与价值主张；六、营销策略；七、营销渠道；八、五个营销活动；九、平台营销文案；
    十、KPI 与评估方法；十一、预算建议；十二、风险与注意事项。
